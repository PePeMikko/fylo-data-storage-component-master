<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Fylo data storage component</title>

</head>
<body>
  <div class="left-box">
    <img src="images/logo.svg" class="logo">
    <div class="left-box-row">
      <img src="images/icon-document.svg" class="document">
      <img src="images/icon-folder.svg" class="folder">
      <img src="images/icon-upload.svg" class="upload">
    </div>
  </div>
  <div class="inside-right-box">
    <h1><span class="black">185</span> GB Left</h1>
  </div> 
  <div class="right-box">
    <p>You’ve used <span class="white">815 GB</span> of your storage</p>
    <div class="gradient"></div>
    <div class="row">
      <p class="gradient-left">0 GB</p>
      <p class="gradient-right">1000 GB</p>
    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
